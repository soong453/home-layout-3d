<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>锁定户型 · 三维模型</title><style>body{margin:0;font-family:'Microsoft YaHei',sans-serif;background:#f7f4ed;color:#34443c}header{padding:18px 24px}h1{font-size:23px;margin:0 0 8px}p{margin:5px 0;font-size:14px}button{background:white;border:1px solid #aaa;border-radius:6px;padding:9px 16px;margin:8px 5px 0 0;cursor:pointer}#view{height:73vh;min-height:450px}footer{padding:10px 24px;font-size:13px}#status{color:#86643c}</style><header><h1>已确认户型 · 固定坐标三维模型</h1><p>拖动旋转，滚轮缩放。模型由同一组坐标构建，不使用图片生成重画户型。</p><button id="top">正上方核对</button><button id="angle">立体看全屋</button><button id="walls">低墙 / 全高墙</button><button id="save">保存当前视角图片</button><p id="status">正在加载三维显示组件（首次打开需联网）…</p></header><div id="view"></div><footer>已同意暂按层高2.6m、门高2.0m展示；其余高度为可视化临时值，不作为施工数据。窗位以蓝色地面标记表示，未猜测窗高。没有新增床、冰箱或厨卫设备。<br>平面尺度沿用截图比例估算；家具位置不变。本页为实时三维材质预览，非照片级离线渲染。</footer><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">

const scale=.01365;function X(x){return(x-362)*scale}function Z(y){return(y-293)*scale}const mats={wall:new T.MeshStandardMaterial({color:'#eee8d9',roughness:.88}),edge:new T.MeshStandardMaterial({color:'#b37d50',roughness:.7}),tile:new T.MeshStandardMaterial({color:'#e4ded0',roughness:.6}),wood:new T.MeshStandardMaterial({color:'#d4b58a',roughness:.8}),blue:new T.MeshStandardMaterial({color:'#c8dfe1',roughness:.6}),cloth:new T.MeshStandardMaterial({color:'#f5eee0',roughness:1}),sage:new T.MeshStandardMaterial({color:'#9cac91',roughness:1}),oak:new T.MeshStandardMaterial({color:'#bf9b68',roughness:.65})};
function box(x,y,w,d,h,mat,bottom=0){let m=new T.Mesh(new T.BoxGeometry(w*scale,h,d*scale),mat);m.position.set(X(x+w/2),bottom+h/2,Z(y+d/2));m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}function floor(x,y,w,d,mat){box(x,y,w,d,.065,mat,-.065)}

function label(text,x,y){let c=document.createElement('canvas');c.width=512;c.height=100;let ctx=c.getContext('2d');ctx.font='bold 44px Microsoft YaHei,sans-serif';ctx.textAlign='center';ctx.fillStyle='#314b40';ctx.fillText(text,256,65);let sprite=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false,transparent:true}));sprite.position.set(X(x),.12,Z(y));sprite.scale.set(2.3,.45,1);scene.add(sprite)}label('卧室 A',184,225);label('新卧室 B',165,366);label('小客厅',427,302);label('厨房',578,276);label('阳台',596,88);label('卫生间',423,487);label('入户',600,454);

function applyWalls(){for(let m of wallMeshes){m.scale.y=low?.16:1;m.position.y=low?.208:1.3}}applyWalls();function angle(){camera.position.set(-7.8,12.5,14.5);controls.target.set(0,0,0);controls.update()}angle();document.querySelector('#angle').onclick=angle;document.querySelector('#top').onclick=()=>{camera.position.set(0,19,.001);controls.target.set(0,0,0);controls.update()};document.querySelector('#walls').onclick=()=>{low=!low;applyWalls()};document.querySelector('#save').onclick=()=>{renderer.render(scene,camera);let a=document.createElement('a');a.download='锁定户型_模型视角.png';a.href=renderer.domElement.toDataURL('image/png');a.click()};document.querySelector('#status').textContent='模型已加载 · 默认低墙方便核对 · 全高墙为2.6m';new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
